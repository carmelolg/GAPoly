<a class="skip" href="#opere">{{skip}}</a>

<header class="top" id="top">
  <div class="top-inner">
    <a class="brand" href="{{brand_url}}" aria-label="{{brand.aria}}">
      <img id="logo" alt="" hidden>
      <svg id="brand-mark" class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 10 4l4 9 3-5 4 12z"/></svg>
      <span id="site-title">{{site_title}}</span>
    </a>
    <nav class="nav" aria-label="{{nav.label}}">
      <a href="{{nav_works}}">{{nav.works}}</a>
      <a href="{{nav_method}}">{{nav.method}}</a>
      <a href="{{nav_info}}">{{nav.info}}</a>
    </nav>
    <div class="top-actions">
      <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="top-extra" aria-label="{{menu.aria}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
      <div class="top-extra" id="top-extra">
      {{{lang_switch}}}
      <a id="repo-link" class="icon-btn" href="#" aria-label="{{repo.aria}}" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
      </a>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="{{theme.aria}}">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>
