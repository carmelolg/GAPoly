<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page_title}}</title>
<meta name="description" content="{{site_description}}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{site_description}}">
<meta property="og:locale" content="{{og_locale}}">
{{{head_links}}}
<script>
  // Theme before first paint, so the page never flashes the wrong colours.
  try { const t = localStorage.getItem("gapoly-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{base}}css/style.css">
<script src="{{base}}js/gallery.js" defer></script>
