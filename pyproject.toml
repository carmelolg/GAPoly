[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carmelolg-gapoly"
version = "0.3.1"
description = "Evolve polygons, discs, Voronoi points, mosaic tiles, glyphs or brush strokes with a genetic algorithm (GALib) until they look like a target photo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["carmelolg-galib>=0.3.0", "numpy>=1.24", "Pillow>=10", "numba>=0.60"]

[project.urls]
Homepage = "https://github.com/carmelolg/GAPoly"
Source = "https://github.com/carmelolg/GAPoly"
Issues = "https://github.com/carmelolg/GAPoly/issues"

[project.optional-dependencies]
live = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
gapoly = "carmelolg.gapoly.cli:main"

# `carmelolg` (shared with GALib) is a PEP 420 namespace package (no __init__.py); `carmelolg.gapoly` is the package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["carmelolg.gapoly*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.coverage.run]
source = ["carmelolg.gapoly"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
